name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (install, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      # VITE_API_URL is unset here, so the build uses the local default. This
      # only checks that the app builds; deployment sets the real value.
      - run: npm run build

  backend:
    name: Backend (install, lint, smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint

      # Plain Node has no build step. Instead, start the server and check
      # /api/health. MONGODB_URI is deliberately unset: CI never gets Atlas
      # credentials, and the API reports db "disconnected" but must still run.
      - name: Smoke test
        env:
          PORT: 5000
        run: |
          node src/server.js > server.log 2>&1 &
          if ! body=$(curl -fsS --retry 20 --retry-connrefused --retry-delay 1 "http://localhost:$PORT/api/health"); then
            echo "::error::GET /api/health failed"
            cat server.log
            exit 1
          fi
          echo "$body"
          if ! node -e 'process.exit(JSON.parse(process.argv[1]).status === "ok" ? 0 : 1)' "$body"; then
            echo "::error::Expected status \"ok\""
            cat server.log
            exit 1
          fi
