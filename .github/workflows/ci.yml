name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (install, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      # VITE_API_URL is unset here, so the build uses the local default. This
      # only checks that the app builds; deployment sets the real value.
      - run: npm run build

  backend:
    name: Backend (install, lint, test, smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint

      # The tests start their own in-memory MongoDB and need no secrets. Its
      # binary is a large download, and the lockfile decides its version.
      - name: Cache the test database
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      - name: Test
        timeout-minutes: 15
        run: npm test

      # Plain Node has no build step. Instead, start the server and check
      # /api/health. MONGODB_URI is deliberately unset: CI never gets Atlas
      # credentials, and the API reports db "disconnected" but must still run.
      - name: Smoke test
        env:
          PORT: 5000
        run: |
          node src/server.js > server.log 2>&1 &
          if ! body=$(curl -fsS --retry 20 --retry-connrefused --retry-delay 1 "http://localhost:$PORT/api/health"); then
            echo "::error::GET /api/health failed"
            cat server.log
            exit 1
          fi
          echo "$body"
          if ! node -e 'process.exit(JSON.parse(process.argv[1]).status === "ok" ? 0 : 1)' "$body"; then
            echo "::error::Expected status \"ok\""
            cat server.log
            exit 1
          fi

  crawler:
    name: Crawler (install, lint, load check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crawler
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crawler/package-lock.json

      - run: npm ci
      - run: npm run lint

      # Lint doesn't resolve imports, so a missing or uncommitted file (say, an
      # adapter listed in sources/index.js but never added to git) would first
      # break the daily crawl. Import every module to catch that here. Entry
      # scripts (crawl.js, backfill.js, tools/) are skipped: importing them would
      # run them.
      # CI never crawls a site and never gets MONGODB_URI.
      - name: Load check
        run: |
          node --input-type=module -e '
            const files = process.argv.slice(1);
            let failed = 0;
            for (const f of files) {
              try {
                await import(`./${f}`);
              } catch (err) {
                failed += 1;
                console.log(`::error file=crawler/${f}::${err.message}`);
              }
            }
            console.log(`${files.length - failed} of ${files.length} modules loaded`);
            process.exit(failed ? 1 : 0);
          ' $(find src -name '*.js' ! -name crawl.js ! -name backfill.js ! -path 'src/tools/*' | sort)
