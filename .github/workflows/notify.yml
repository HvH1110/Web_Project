name: Report failed scheduled runs

# When a scheduled run of the daily crawl or the nightly backfill doesn't end in
# success, this opens an issue named after that workflow, or adds a comment to
# the one already open. GitHub then notifies everyone watching the repository,
# and the issue stays open until a person closes it. See devops/DEPLOY.md,
# section Daily schedule.
#
# It can't report a run that never starts. Runs started by hand aren't reported:
# whoever started one is watching it.
on:
  workflow_run:
    workflows: [Daily crawl, Nightly backfill]
    types: [completed]

permissions:
  issues: write

jobs:
  report:
    name: Open or update an issue
    # Not only "failure": a run that reaches its time limit, or is cancelled
    # while it waits for another one, also means a night without data.
    if: ${{ github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          STARTED: ${{ github.event.workflow_run.run_started_at }}
        run: |
          title="Scheduled run failed: $WORKFLOW"
          body="The scheduled run that started at $STARTED (UTC) ended as \`$CONCLUSION\`: $RUN_URL

          What to do is in devops/DEPLOY.md, section Daily schedule. Close this issue once it's dealt with; another failure opens a new one."
          number=$(gh issue list --state open --limit 200 --json number,title | jq -r --arg t "$title" 'map(select(.title == $t))[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
